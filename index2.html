<!DOCTYPE html>
<html>

<head>
    <title>Vocabulary Escape</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151922;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: 90%;
            max-width: 720px;
            background-color: #202632;
            border: 1px solid #394352;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .mission {
            font-size: 15px;
            letter-spacing: 2px;
            color: #8fa3bd;
        }

        .escape {
            font-size: 15px;
            color: #7ee2c0;
            font-weight: bold;
        }

        .bar {
            width: 100%;
            height: 8px;
            background-color: #343d4b;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 35px;
        }

        #progressBar {
            width: 20%;
            height: 100%;
            background-color: #7ee2c0;
            transition: width 0.4s;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 3px;
        }

        .title p {
            color: #8995a7;
            margin-top: 10px;
        }

        .question-card {
            background-color: #181e27;
            border: 1px solid #343e4d;
            border-radius: 18px;
            padding: 35px 25px;
            text-align: center;
            margin-bottom: 25px;
        }

        .word-label {
            color: #7ee2c0;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        #question {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 18px 10px;
            border-radius: 14px;
            border: 1px solid #465365;
            background-color: #293240;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #344052;
            border-color: #7ee2c0;
            transform: translateY(-2px);
        }

        #feedback {
            min-height: 65px;
            margin: 25px 0 0;
            padding: 15px;
            border-radius: 12px;
            background-color: #252e3a;
            color: #c8d1dd;
            text-align: center;
            line-height: 1.5;
            font-size: 16px;
        }

        .hint {
            color: #ffd479;
        }

        .correct {
            color: #7ee2c0;
        }

        .complete {
            text-align: center;
        }

        .complete h2 {
            color: #7ee2c0;
            font-size: 32px;
        }

        @media (max-width: 600px) {
            .game {
                padding: 25px 18px;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            #question {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <div class="top">
            <div class="mission">
                MISSION <span id="missionNumber">01</span> / 05
            </div>

            <div class="escape">
                ESCAPE MODE
            </div>
        </div>

        <div class="bar">
            <div id="progressBar"></div>
        </div>

        <div class="title">
            <h1>VOCABULARY ESCAPE</h1>
            <p>Complete all five missions to escape.</p>
        </div>

        <div class="question-card">

            <div class="word-label">
                WORD CHALLENGE
            </div>

            <p id="question">
                What does "break through" mean?
            </p>

        </div>

        <div class="choices">

            <button id="button1"></button>
            <button id="button2"></button>
            <button id="button3"></button>

        </div>

        <h3 id="feedback"></h3>

    </div>


    <script>

        const questions = [

            {
                word: "break through",
                correct: "succeed",
                choices: ["Participate in", "Succeed", "Watch"],
                hint: "It means to overcome a difficulty and make progress.",
                explanation: "Break through means to overcome a difficulty and succeed."
            },

            {
                word: "find out",
                correct: "discover",
                choices: ["Discover", "Build", "Organize"],
                hint: "It means to learn information about something.",
                explanation: "Find out means to discover or learn information."
            },

            {
                word: "set up",
                correct: "establish",
                choices: ["Establish", "Remove", "Watch"],
                hint: "It means to create or arrange something.",
                explanation: "Set up means to establish or arrange something."
            },

            {
                word: "sort out",
                correct: "organize",
                choices: ["Organize", "Break", "Forget"],
                hint: "It means to arrange things in order.",
                explanation: "Sort out means to organize or solve something."
            },

            {
                word: "pay attention to",
                correct: "focus on",
                choices: ["Focus on", "Give away", "Turn off"],
                hint: "It means to look or listen carefully.",
                explanation: "Pay attention to means to focus on something carefully."
            }

        ];


        let currentQuestion = 0;
        let wrongAttempts = 0;


        function loadQuestion() {

            const q = questions[currentQuestion];

            document.getElementById("missionNumber").innerText =
                String(currentQuestion + 1).padStart(2, "0");

            document.getElementById("progressBar").style.width =
                ((currentQuestion + 1) / questions.length * 100) + "%";

            document.getElementById("question").innerText =
                'What does "' + q.word + '" mean?';

            document.getElementById("button1").innerText =
                q.choices[0];

            document.getElementById("button2").innerText =
                q.choices[1];

            document.getElementById("button3").innerText =
                q.choices[2];

            document.getElementById("button1").onclick = function () {
                checkAnswer(q.choices[0]);
            };

            document.getElementById("button2").onclick = function () {
                checkAnswer(q.choices[1]);
            };

            document.getElementById("button3").onclick = function () {
                checkAnswer(q.choices[2]);
            };

            document.getElementById("feedback").innerText = "";

            wrongAttempts = 0;
        }


        function checkAnswer(answer) {

            const q = questions[currentQuestion];

            if (answer.toLowerCase() === q.correct.toLowerCase()) {

                document.getElementById("feedback").innerHTML =
                    '<span class="correct">✓ Correct! Mission cleared.</span>';

                currentQuestion++;

                if (currentQuestion < questions.length) {

                    setTimeout(loadQuestion, 1000);

                } else {

                    showComplete();
                }

            } else {

                wrongAttempts++;

                if (wrongAttempts === 1) {

                    document.getElementById("feedback").innerHTML =
                        '<span class="hint">HINT</span><br>' +
                        q.hint + "<br>Try again.";

                } else {

                    document.getElementById("feedback").innerHTML =
                        "The answer is <strong>" +
                        q.correct +
                        "</strong>.<br>" +
                        q.explanation;
                }
            }
        }


        function showComplete() {

            document.querySelector(".title").innerHTML =
                '<div class="complete">' +
                '<h2>ESCAPE COMPLETE</h2>' +
                '<p>You cleared all 5 vocabulary missions.</p>' +
                '</div>';

            document.getElementById("question").innerText =
                "MISSION ACCOMPLISHED";

            document.getElementById("progressBar").style.width =
                "100%";

            document.getElementById("feedback").innerHTML =
                '<span class="correct">✓ All missions cleared. Great job!</span>';

            document.getElementById("button1").style.display = "none";
            document.getElementById("button2").style.display = "none";
            document.getElementById("button3").style.display = "none";

            document.getElementById("missionNumber").innerText = "05";
        }


        loadQuestion();

    </script>

</body>

</html>
