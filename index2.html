<!DOCTYPE html>
<html>

<head>
    <title>My Second English Learning App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff1f7;
        }

        .app {
            width: 90%;
            max-width: 650px;
            background-color: white;
            border: 5px solid #ffd6e7;
            border-radius: 30px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .star {
            position: absolute;
            font-size: 35px;
        }

        .star1 {
            top: 15px;
            left: 25px;
        }

        .star2 {
            top: 20px;
            right: 30px;
        }

        .star3 {
            bottom: 20px;
            left: 35px;
        }

        h1 {
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 38px;
            color: #ff7fab;
        }

        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 25px;
        }

        #progress {
            display: inline-block;
            background-color: #fff0a8;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #806d00;
            margin-bottom: 25px;
        }

        .question-box {
            background-color: #e8f7ff;
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 25px;
        }

        #question {
            font-size: 27px;
            font-weight: bold;
            color: #4d7185;
            margin: 0;
        }

        button {
            display: block;
            width: 85%;
            margin: 13px auto;
            padding: 15px;
            font-size: 21px;
            font-weight: bold;
            border: 3px solid #cde9ff;
            border-radius: 18px;
            background-color: #f4fbff;
            color: #52758c;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #d9f1ff;
            transform: scale(1.03);
        }

        #feedback {
            min-height: 55px;
            margin-top: 25px;
            padding: 12px;
            border-radius: 15px;
            background-color: #fff7fb;
            color: #ff6699;
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="star star1">⭐</div>
        <div class="star star2">🌸</div>
        <div class="star star3">⭐</div>

        <h1>🌷 Word Garden 🌷</h1>

        <div class="subtitle">
            Let's learn English words!
        </div>

        <div id="progress">
            Question 1 of 5
        </div>

        <div class="question-box">
            <p id="question">
                What does "break through" mean?
            </p>
        </div>

        <button id="button1"></button>
        <button id="button2"></button>
        <button id="button3"></button>

        <h3 id="feedback"></h3>

    </div>


    <script>

        const questions = [
            {
                word: "break through",
                correct: "succeed",
                choices: ["Participate in", "Succeed", "Watch"],
                hint: "It means to overcome a difficulty and make progress.",
                explanation: "Break through means to overcome a difficulty and succeed."
            },

            {
                word: "find out",
                correct: "discover",
                choices: ["Discover", "Build", "Organize"],
                hint: "It means to learn information about something.",
                explanation: "Find out means to discover or learn information."
            },

            {
                word: "set up",
                correct: "establish",
                choices: ["Establish", "Remove", "Watch"],
                hint: "It means to create or arrange something.",
                explanation: "Set up means to establish or arrange something."
            },

            {
                word: "sort out",
                correct: "organize",
                choices: ["Organize", "Break", "Forget"],
                hint: "It means to arrange things in order.",
                explanation: "Sort out means to organize or solve something."
            },

            {
                word: "pay attention to",
                correct: "focus on",
                choices: ["Focus on", "Give away", "Turn off"],
                hint: "It means to look or listen carefully.",
                explanation: "Pay attention to means to focus on something carefully."
            }
        ];

        let currentQuestion = 0;
        let wrongAttempts = 0;


        function loadQuestion() {

            const q = questions[currentQuestion];

            document.getElementById("progress").innerText =
                "Question " + (currentQuestion + 1) + " of 5";

            document.getElementById("question").innerText =
                'What does "' + q.word + '" mean?';

            document.getElementById("button1").innerText = q.choices[0];
            document.getElementById("button2").innerText = q.choices[1];
            document.getElementById("button3").innerText = q.choices[2];

            document.getElementById("button1").onclick = function () {
                checkAnswer(q.choices[0]);
            };

            document.getElementById("button2").onclick = function () {
                checkAnswer(q.choices[1]);
            };

            document.getElementById("button3").onclick = function () {
                checkAnswer(q.choices[2]);
            };

            document.getElementById("feedback").innerText = "";

            wrongAttempts = 0;
        }


        function checkAnswer(answer) {

            const q = questions[currentQuestion];

            if (answer.toLowerCase() === q.correct.toLowerCase()) {

                document.getElementById("feedback").innerText =
                    "🌟 Correct! Great job! 🌟";

                currentQuestion++;

                if (currentQuestion < questions.length) {

                    setTimeout(loadQuestion, 1000);

                } else {

                    document.getElementById("progress").innerText =
                        "🎉 Quiz Complete! 🎉";

                    document.getElementById("question").innerText =
                        "You finished all 5 words!";

                    document.getElementById("feedback").innerText =
                        "🌸 Amazing! You did a great job! 🌸";

                    document.getElementById("button1").style.display = "none";
                    document.getElementById("button2").style.display = "none";
                    document.getElementById("button3").style.display = "none";
                }

            } else {

                wrongAttempts++;

                if (wrongAttempts === 1) {

                    document.getElementById("feedback").innerText =
                        "💡 Hint: " + q.hint + " Try again!";

                } else {

                    document.getElementById("feedback").innerText =
                        "📖 The answer is " + q.correct +
                        ". " + q.explanation;
                }
            }
        }


        loadQuestion();

    </script>

</body>

</html>
