<!DOCTYPE html>
<html>

<head>
    <title>My second English Learning Apps</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 26px;
            padding: 18px;
            margin: 5px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "break through" mean?</p>

    <button onclick="checkAnswer('participate')">
        Participate in
    </button>

    <button onclick="checkAnswer('succeed')">
        Succeed
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "Succeed") {
                document.getElementById("feedback").innerText =
                    "맞았어!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "틀렸어. The answer is Succeed.";
            }

        }

    </script>

</body>
</html>
